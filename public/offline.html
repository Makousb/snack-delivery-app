<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You're offline — Snack</title>
  <link rel="icon" href="/images/snack-logo.svg" type="image/svg+xml" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 0.4rem;
      padding: 2rem 1.2rem;
      background: linear-gradient(160deg, #f3f8f3, #eefbf2);
      color: #102013;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 1rem; }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    p { max-width: 40ch; margin: 0.6rem 0 1.4rem; color: #66746a; line-height: 1.6; }
    button {
      padding: 0.85rem 1.6rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #166534, #16a34a);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/images/snack-logo.svg" alt="Snack logo" />
  <h1>You're offline</h1>
  <p>Snack needs a connection to load menus and place orders. Check your internet and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
